syntax = "proto3";

package library.v1;

import "buf/validate/validate.proto";
import "library/v1/artist.proto";
import "library/v1/album.proto";
import "library/v1/track.proto";

message ListArtistsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListArtistsResponse {
  repeated Artist items = 1;
  string next_page_token = 2;
}

message GetArtistRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message GetArtistResponse {
  Artist artist = 1;
}

// BootlegFilter selects how a listing treats bootleg releases.
enum BootlegFilter {
  // BOOTLEG_FILTER_UNSPECIFIED lists bootlegs alongside everything else.
  BOOTLEG_FILTER_UNSPECIFIED = 0;
  BOOTLEG_FILTER_EXCLUDE = 1;
  BOOTLEG_FILTER_ONLY = 2;
}

message ListAlbumsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string artist_id = 3;

  // include_all_versions lists a release's alternate versions
  // alongside its primary rather than the primary alone.
  bool include_all_versions = 4;

  // album_types restricts the listing to the given release types. An
  // empty list matches every type.
  repeated AlbumType album_types = 5;

  BootlegFilter bootlegs = 6;
}

message ListAlbumsResponse {
  repeated Album items = 1;
  string next_page_token = 2;
}

message ListAlbumVersionsRequest {
  string album_id = 1 [(buf.validate.field).required = true];
}

// ListAlbumVersionsResponse holds every version of one release,
// including the album that was asked for. Version groups are small, so
// the whole group is returned unpaginated.
message ListAlbumVersionsResponse {
  repeated Album items = 1;
}

message GetAlbumRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message GetAlbumResponse {
  Album album = 1;
}

message ListTracksRequest {
  int32 page_size = 1;
  string page_token = 2;
  string album_id = 3;
}

message ListTracksResponse {
  repeated Track items = 1;
  string next_page_token = 2;
}

message GetTrackRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message GetTrackResponse {
  Track track = 1;
}

service LibraryService {
  rpc ListArtists(ListArtistsRequest) returns (ListArtistsResponse) {}
  rpc GetArtist(GetArtistRequest) returns (GetArtistResponse) {}
  rpc ListAlbums(ListAlbumsRequest) returns (ListAlbumsResponse) {}
  rpc GetAlbum(GetAlbumRequest) returns (GetAlbumResponse) {}
  rpc ListAlbumVersions(ListAlbumVersionsRequest) returns (ListAlbumVersionsResponse) {}
  rpc ListTracks(ListTracksRequest) returns (ListTracksResponse) {}
  rpc GetTrack(GetTrackRequest) returns (GetTrackResponse) {}
}

